name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# ----------------------------------------------------------------------------
# AUTOMATIC SECRET SYNC TO CLOUDFLARE
# ----------------------------------------------------------------------------
# You only need THREE GitHub Actions secrets — set them once in:
#   GitHub repo → Settings → Secrets and variables → Actions
#
#   1. CLOUDFLARE_API_TOKEN        (required to deploy at all)
#   2. CLOUDFLARE_ACCOUNT_ID       (required to deploy at all)
#   3. SUPABASE_SERVICE_ROLE_KEY   (so admin server fns can talk to the DB)
#
# Optional extras (only add if you actually use them):
#   - SUPABASE_JWKS, SUPABASE_DB_URL, SUPABASE_ANON_KEY
#   - LOVABLE_API_KEY, ENV_IMPORT_TOKEN
#
# Public values (URL + publishable key + project id) are hardcoded below
# because they're already in wrangler.jsonc and the client bundle — they are
# NOT secrets. This means: a fresh clone deploys with just the 3 secrets
# above, and every push automatically re-syncs everything to Cloudflare.
# ----------------------------------------------------------------------------

env:
  PUB_SUPABASE_URL: https://ifdzsewtaxylwzeqjide.supabase.co
  PUB_SUPABASE_PUBLISHABLE_KEY: sb_publishable_p-5dDUvFJY4hbubfFwchXg_Vl3CVinO
  PUB_SUPABASE_PROJECT_ID: ifdzsewtaxylwzeqjide

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate required secrets
        shell: bash
        env:
          SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          MISSING=()
          [ -z "$CF_TOKEN" ]   && MISSING+=("CLOUDFLARE_API_TOKEN")
          [ -z "$CF_ACCOUNT" ] && MISSING+=("CLOUDFLARE_ACCOUNT_ID")
          [ -z "$SRK" ]        && MISSING+=("SUPABASE_SERVICE_ROLE_KEY")
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error ::Missing required GitHub Actions secrets: ${MISSING[*]}"
            echo "::error ::Add them in: GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✓ Required secrets present — Cloudflare will be synced automatically"

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ env.PUB_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.PUB_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ env.PUB_SUPABASE_PROJECT_ID }}

      # wrangler-action uploads everything in `secrets:` to Cloudflare as
      # encrypted Worker secrets on every deploy — no manual Cloudflare clicks.
      # Empty values are skipped automatically by wrangler.
      - name: Deploy to Cloudflare Workers (auto-sync all secrets)
        uses: cloudflare/wrangler-action@v3
        env:
          SUPABASE_URL: ${{ env.PUB_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.PUB_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_JWKS: ${{ secrets.SUPABASE_JWKS }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          ENV_IMPORT_TOKEN: ${{ secrets.ENV_IMPORT_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY
            SUPABASE_SERVICE_ROLE_KEY
            SUPABASE_ANON_KEY
            SUPABASE_JWKS
            SUPABASE_DB_URL
            LOVABLE_API_KEY
            ENV_IMPORT_TOKEN
