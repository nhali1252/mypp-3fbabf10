name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Prepare Worker runtime secrets
        shell: bash
        env:
          WORKER_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          FALLBACK_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          WORKER_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          FALLBACK_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          RESOLVED_URL="${WORKER_SUPABASE_URL:-$FALLBACK_SUPABASE_URL}"
          RESOLVED_KEY="${WORKER_SUPABASE_PUBLISHABLE_KEY:-$FALLBACK_SUPABASE_PUBLISHABLE_KEY}"

          MISSING=()
          [ -z "$RESOLVED_URL" ] && MISSING+=("SUPABASE_URL (or VITE_SUPABASE_URL)")
          [ -z "$RESOLVED_KEY" ] && MISSING+=("SUPABASE_PUBLISHABLE_KEY (or VITE_SUPABASE_PUBLISHABLE_KEY)")
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && MISSING+=("SUPABASE_SERVICE_ROLE_KEY")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error ::Missing required GitHub Actions secrets: ${MISSING[*]}"
            echo "::error ::Add them in: Repo Settings → Secrets and variables → Actions. See DEPLOYMENT.md."
            exit 1
          fi

          echo "SUPABASE_URL=$RESOLVED_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_PUBLISHABLE_KEY=$RESOLVED_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "✓ All required Supabase secrets resolved (URL host: $(echo "$RESOLVED_URL" | sed 's|https://||' | cut -d. -f1))"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY
            SUPABASE_SERVICE_ROLE_KEY