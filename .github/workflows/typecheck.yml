name: Typecheck

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript typecheck
        # Fails the job (and blocks the PR merge when this check is required)
        # on any TS error, including missing component exports like
        # `Cannot find name 'LauncherSkeleton'`.
        run: bunx tsc --noEmit --pretty
